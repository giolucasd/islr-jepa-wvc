global:
  seed: 73
  model_name: vjepa

execution:
  batch_size: 32
  accumulate_grad_batches: 1
  num_workers: 8
  use_gradient_checkpointing: true

dataset:
  data_root: /path/to/lsfb-isol/
  train_split: si_train
  val_split: si_val
  num_classes: 700

pipeline:
  max_frames: 80
  num_frames: 48
  crop_size: 384
  target_fps: 25.0

model:
  pretrained_path: /path/to/vjepa2_1_vitb_dist_vitG_384.pt
  freeze_encoder: true

  vjepa:
    head_dropout: 0.4

optimizer:
  name: adamw
  lr: 2.2e-4
  weight_decay: 1.0e-4

training:
  max_epochs: 50
  warmup_epochs: 5
  resume_from: null
