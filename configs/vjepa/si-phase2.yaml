global:
  seed: 73
  model_name: vjepa

execution:
  batch_size: 16
  accumulate_grad_batches: 2
  num_workers: 4
  use_gradient_checkpointing: true

dataset:
  data_root: /path/to/lsfb-isol
  train_split: si_train
  val_split: si_val
  num_classes: 700

pipeline:
  max_frames: 80
  num_frames: 48
  crop_size: 384

model:
  pretrained_path: /path/to/vjepa2_1_vitb_dist_vitG_384.pt
  freeze_encoder: false

  vjepa:
    head_dropout: 0.4

optimizer:
  name: adamw
  lr: 3.3e-6
  weight_decay: 5.6e-2

training:
  max_epochs: 50
  warmup_epochs: 5
  load_weights_from: /path/to/phase1_checkpoint.ckpt # initialize weights only
  resume_from: /path/to/phase1_checkpoint.ckpt # continue interrupted run
