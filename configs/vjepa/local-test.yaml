global:
  seed: 73
  model_name: vjepa

execution:
  batch_size: 3
  accumulate_grad_batches: 1
  num_workers: 0
  use_gradient_checkpointing: false

dataset:
  data_root: /path/to/lsfb-isol/
  train_split: local_sample # created by scripts/splits/make_local_split.py
  val_split: local_sample
  num_classes: 700

pipeline:
  max_frames: 80
  num_frames: 48
  crop_size: 384

model:
  pretrained_path: /path/to/vjepa2_1_vitb_dist_vitG_384.pt
  freeze_encoder: true

  vjepa:
    head_dropout: 0.4

optimizer:
  name: adamw
  lr: 2.2e-4
  weight_decay: 1.0e-4

training:
  max_epochs: 4
  warmup_epochs: 1
  resume_from: null
