[project]
name = "islr"
version = "1.0.0"
description = "Isolated Sign Language Recognition"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "einops>=0.8.2",
    "lsfb-dataset==2.0.1",
    "opencv-python>=4.13.0.92",
    "optuna>=4.8.0",
    "optuna-integration[pytorch-lightning]>=4.8.0",
    "pandas>=2.3.3",
    "pytorch-lightning>=2.6.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.26",
    "torch>=2.10.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
